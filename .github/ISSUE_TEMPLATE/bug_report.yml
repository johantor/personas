name: Bug report
description: A command fails, a persona misbehaves, or a report is wrong.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Navigation off the allowlist, a write without `allowWrites`, or a page that makes a
        visitor act on its text is a security bug. Report it privately as SECURITY.md
        describes, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the command or the report did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command you ran, the persona, and the site (a public URL if you can share one).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant steps or report lines
      description: The matching lines from `steps.jsonl` or `report.md`. Remove anything private.
      render: text
  - type: input
    id: personas-version
    attributes:
      label: personas version
      description: From `claude plugin list`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: From `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (Git Bash)
        - Windows (WSL)
        - Other
    validations:
      required: true
